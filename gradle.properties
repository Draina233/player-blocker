org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
# Do not pin org.gradle.java.home here: the path is machine-specific and would break every
# other build. JDK 25 is selected via JAVA_HOME instead.

# Minecraft / toolchain — pinned to the versions this instance actually runs.
# 26.x is unobfuscated, therefore: no mappings, no remap, plain 'implementation' deps.
minecraft_version=26.2
loader_version=0.19.3
fabric_api_version=0.155.2+26.2
loom_version=1.19.4

# Mod
mod_version=0.2.3
maven_group=io.github.playerblocker
archives_base_name=playerblocker
